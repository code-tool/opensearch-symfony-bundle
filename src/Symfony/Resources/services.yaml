services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false
  CodeTool\OpenSearch\Index\IndexConfigFactory:
    class: CodeTool\OpenSearch\Index\IndexConfigFactory
    arguments:
      - '%opensearch.config.indexes%'
  OpenSearchBundle\Index\IndexManager:
    arguments:
      - '@CodeTool\OpenSearch\Index\IndexConfigFactory'
      - '@OpenSearch\Client'
  OpenSearchBundle\Command\IndexCreateCommand:
    arguments:
      $indexManager: '@OpenSearchBundle\Service\IndexManager'
